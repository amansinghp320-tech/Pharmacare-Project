<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supplier Management - PharmaCare</title>
    <link rel="stylesheet" href="dashboard.css" />
    <link rel="stylesheet" href="sales.css" />
    <link rel="stylesheet" href="customers.css" />
    <!-- Using customers.css for action buttons -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>
  <body>
    <div class="container">
      <!-- Sidebar Navigation -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <span class="material-symbols-outlined">medical_services</span>
          <h2>PharmaCare</h2>
        </div>
        <ul class="sidebar-menu">
          <li>
            <a href="dashboard.html"
              ><span class="material-symbols-outlined">dashboard</span>
              Dashboard</a
            >
          </li>
          <li>
            <a href="inventory.html"
              ><span class="material-symbols-outlined">inventory_2</span>
              Inventory</a
            >
          </li>
          <li>
            <a href="sales.html"
              ><span class="material-symbols-outlined">point_of_sale</span>
              Sales</a
            >
          </li>
          <li>
            <a href="customers.html"
              ><span class="material-symbols-outlined">group</span> Customers</a
            >
          </li>
          <li class="active">
            <a href="suppliers.html"
              ><span class="material-symbols-outlined">local_shipping</span>
              Suppliers</a
            >
          </li>
          <li>
            <a href="settings.html"
              ><span class="material-symbols-outlined">settings</span>
              Settings</a
            >
          </li>
        </ul>
      </aside>

      <!-- Main Content Area -->
      <main class="main-content">
        <header class="main-header">
          <h1>Supplier Management</h1>
          <div class="header-actions">
            <input
              type="text"
              id="searchSupplierInput"
              placeholder="Search by name or contact..."
            />
            <button class="add-new-btn" id="add-supplier-btn">
              + Add Supplier
            </button>
          </div>
        </header>

        <div class="table-container">
          <table id="supplier-table" class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Supplier Name</th>
                <th>Contact Person</th>
                <th>Phone Number</th>
                <th>Email</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="supplier-table-body">
              <!-- Supplier rows will be dynamically inserted here -->
            </tbody>
          </table>
        </div>
      </main>
    </div>

    <!-- Modal for Adding and Editing Suppliers -->
    <div id="supplier-modal" class="modal">
      <div class="modal-content">
        <header class="modal-header">
          <h2 id="modal-title">Add New Supplier</h2>
          <span class="close-button">&times;</span>
        </header>
        <form id="supplier-form">
          <input type="hidden" id="supplierId" />

          <div class="form-group">
            <label for="supplierName">Supplier Name</label>
            <input type="text" id="supplierName" required />
          </div>

          <div class="form-group">
            <label for="contactPerson">Contact Person</label>
            <input type="text" id="contactPerson" />
          </div>

          <div class="form-group">
            <label for="phoneNumber">Phone Number</label>
            <input type="tel" id="phoneNumber" required />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" />
          </div>

          <button type="submit" class="submit-btn">Save Supplier</button>
        </form>
      </div>
    </div>

    <script src="suppliers.js"></script>
  </body>
</html>
