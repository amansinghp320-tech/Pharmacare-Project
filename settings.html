<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings - PharmaCare</title>
    <link rel="stylesheet" href="dashboard.css" />
    <link rel="stylesheet" href="sales.css" />
    <!-- Google Fonts for Icons -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>
  <body>
    <div class="container">
      <!-- Sidebar Navigation -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <span class="material-symbols-outlined">medical_services</span>
          <h2>PharmaCare</h2>
        </div>
        <ul class="sidebar-menu">
          <li>
            <a href="dashboard.html"
              ><span class="material-symbols-outlined">dashboard</span>
              Dashboard</a
            >
          </li>
          <li>
            <a href="inventory.html"
              ><span class="material-symbols-outlined">inventory_2</span>
              Inventory</a
            >
          </li>
          <li>
            <a href="sales.html"
              ><span class="material-symbols-outlined">point_of_sale</span>
              Sales</a
            >
          </li>
          <li>
            <a href="customers.html"
              ><span class="material-symbols-outlined">group</span> Customers</a
            >
          </li>
          <li>
            <a href="suppliers.html"
              ><span class="material-symbols-outlined">local_shipping</span>
              Suppliers</a
            >
          </li>
          <li class="active">
            <a href="settings.html"
              ><span class="material-symbols-outlined">settings</span>
              Settings</a
            >
          </li>
        </ul>
      </aside>

      <!-- Main Content Area -->
      <main class="main-content">
        <header class="main-header">
          <h1>Settings</h1>
        </header>

        <div class="table-container">
          <h2>User Profile</h2>
          <form id="profile-form">
            <div class="form-group">
              <label for="username">Username</label>
              <input type="text" id="username" value="Admin" />
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" value="admin@pharmacare.com" />
            </div>
            <button type="submit" class="submit-btn">Update Profile</button>
          </form>
        </div>

        <div class="table-container" style="margin-top: 30px">
          <h2>Application Settings</h2>
          <form id="app-settings-form">
            <div class="form-group">
              <label for="low-stock-threshold">Low Stock Threshold</label>
              <input type="number" id="low-stock-threshold" value="50" />
            </div>
            <div class="form-group">
              <label for="currency-symbol">Currency Symbol</label>
              <input type="text" id="currency-symbol" value="₹" />
            </div>
            <button type="submit" class="submit-btn">Save Settings</button>
          </form>
        </div>
      </main>
    </div>

    <script src="settings.js"></script>
  </body>
</html>
