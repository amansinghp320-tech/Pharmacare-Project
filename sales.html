<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sales History - PharmaCare</title>
    <link rel="stylesheet" href="dashboard.css" />
    <link rel="stylesheet" href="sales.css" />
    <!-- Google Fonts for Icons -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <span class="material-symbols-outlined">medical_services</span>
          <h2>PharmaCare</h2>
        </div>
        <ul class="sidebar-menu">
          <li>
            <a href="dashboard.html"
              ><span class="material-symbols-outlined">dashboard</span>
              Dashboard</a
            >
          </li>
          <li>
            <a href="inventory.html"
              ><span class="material-symbols-outlined">inventory_2</span>
              Inventory</a
            >
          </li>
          <li class="active">
            <a href="sales.html"
              ><span class="material-symbols-outlined">point_of_sale</span>
              Sales</a
            >
          </li>
          <li>
            <a href="customers.html"
              ><span class="material-symbols-outlined">group</span> Customers</a
            >
          </li>
          <li>
            <a href="suppliers.html"
              ><span class="material-symbols-outlined">local_shipping</span>
              Suppliers</a
            >
          </li>
          <li>
            <a href="settings.html"
              ><span class="material-symbols-outlined">settings</span>
              Settings</a
            >
          </li>
        </ul>
      </aside>

      <main class="main-content">
        <header class="main-header">
          <h1>Sales History</h1>
          <div class="header-actions">
            <input
              type="text"
              id="searchSalesInput"
              placeholder="Search by Sale ID or Customer..."
            />
            <button class="add-new-btn" id="new-sale-btn">+ New Sale</button>
          </div>
        </header>

        <div class="table-container">
          <section class="sales-table-section">
            <table id="sales-table" class="data-table">
              <thead>
                <tr>
                  <th>Sale ID</th>
                  <th>Customer Name</th>
                  <th>Sale Date</th>
                  <th>Total Amount</th>
                </tr>
              </thead>
              <tbody id="sales-table-body">
                <!-- JS will populate this -->
              </tbody>
            </table>
          </section>
        </div>
      </main>
    </div>

    <!-- New Sale Modal -->
    <div id="new-sale-modal" class="modal">
      <div class="modal-content">
        <header class="modal-header">
          <h2>Add New Sale</h2>
          <span class="close-button">&times;</span>
        </header>
        <form id="new-sale-form">
          <div class="form-group">
            <label for="customerName">Customer Name</label>
            <input
              type="text"
              id="customerName"
              placeholder="Enter customer name or leave blank for Walk-in"
            />
          </div>
          <div class="form-group">
            <label for="totalAmount">Total Amount (₹)</label>
            <input type="number" id="totalAmount" step="0.01" required />
          </div>
          <button type="submit" class="submit-btn">Create Sale</button>
        </form>
      </div>
    </div>

    <script src="sales.js"></script>
  </body>
</html>
